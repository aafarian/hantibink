<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=DM+Sans:opsz,wght@9..40,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; }
  .stage {
    position: relative; width: 1024px; height: 500px;
    background: #081420; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 56px;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); }
  .b1 { width: 460px; height: 460px; background: #E03926; opacity: 0.38; top: -200px; left: -120px; }
  .b2 { width: 420px; height: 420px; background: #013B6D; opacity: 0.55; bottom: -180px; right: -100px; }
  .b3 { width: 340px; height: 340px; background: #F17D21; opacity: 0.22; bottom: -220px; left: 38%; }
  .tricolor {
    position: absolute; bottom: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #E03926 0 33.4%, #2D62C4 33.4% 66.7%, #F17D21 66.7% 100%);
  }
  .icon {
    position: relative; width: 168px; height: 168px; border-radius: 42px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 90px rgba(224,57,38,0.25);
  }
  .text { position: relative; max-width: 560px; }
  .brand {
    font: 800 78px 'Outfit', sans-serif; color: #FDF2E0;
    letter-spacing: -0.03em; line-height: 1; margin-bottom: 18px;
  }
  .slogan {
    font: 700 34px 'Outfit', sans-serif; letter-spacing: -0.015em; line-height: 1.2;
    color: #FDF2E0; margin-bottom: 14px;
  }
  .slogan .grad {
    background: linear-gradient(92deg, #FF5A47, #F17D21);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font: 500 21px 'DM Sans', sans-serif; color: rgba(253,242,224,0.62); }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <img class="icon" src="../icon-512.png">
    <div class="text">
      <div class="brand">hantibink</div>
      <div class="slogan">Good conversations <span class="grad">lead somewhere.</span></div>
      <div class="sub">The dating app for Armenians everywhere</div>
    </div>
    <div class="tricolor"></div>
  </div>
</body>
</html>

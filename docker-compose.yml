version: "3.8"

# Local full-stack run: API + PostgreSQL.
# (nginx/redis were removed — they mounted config files that never existed,
# so `docker compose up` always failed, and nothing in the app uses Redis.)

services:
  # API Server
  api:
    build: ./api
    ports:
      - "4242:4242"
    environment:
      - NODE_ENV=development
      - PORT=4242
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://hantibink_user:hantibink_password@postgres:5432/hantibink_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hantibink-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=hantibink_dev
      - POSTGRES_USER=hantibink_user
      - POSTGRES_PASSWORD=hantibink_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hantibink_user -d hantibink_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hantibink-network

volumes:
  postgres_data:

networks:
  hantibink-network:
    driver: bridge

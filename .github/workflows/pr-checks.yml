name: PR Checks

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hantibink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: api
        run: npm install

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      - name: Push schema to test database
        working-directory: api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hantibink_test
          DIRECT_URL: postgresql://test:test@localhost:5432/hantibink_test
        run: npx prisma db push --accept-data-loss

      - name: Run tests with coverage
        working-directory: api
        env:
          # Only set TEST_DATABASE_URL - test setup will use this and override DATABASE_URL
          # This satisfies the safety check that prevents TEST_DATABASE_URL == DATABASE_URL
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/hantibink_test
          TEST_DIRECT_URL: postgresql://test:test@localhost:5432/hantibink_test
          JWT_SECRET: test-secret-key-for-ci
          ADMIN_EMAIL: admin@example.com
          NODE_ENV: test
        run: npx vitest run --coverage

      - name: Report coverage
        if: always()
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read coverage summary
            const coveragePath = 'api/coverage/coverage-summary.json';
            if (!fs.existsSync(coveragePath)) {
              console.log('No coverage file found');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const total = coverage.total;

            const lines = total.lines.pct.toFixed(1);
            const statements = total.statements.pct.toFixed(1);
            const functions = total.functions.pct.toFixed(1);
            const branches = total.branches.pct.toFixed(1);

            const body = `## 📊 Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Lines | ${lines}% |
            | Statements | ${statements}% |
            | Functions | ${functions}% |
            | Branches | ${branches}% |

            <details>
            <summary>Coverage thresholds</summary>

            - ✅ Good: > 80%
            - ⚠️ Warning: 60-80%
            - ❌ Low: < 60%
            </details>`;

            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes('Test Coverage Report'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: api
        run: npm install

      - name: Lint API
        working-directory: api
        run: npm run lint

  lint-mobile:
    name: Lint Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Lint Mobile
        working-directory: mobile
        run: npm run lint

  test-mobile:
    name: Test Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run mobile tests
        working-directory: mobile
        run: npm test -- --ci

  migration-reminder:
    name: Migration Reminder
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for migration files
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const hasSchemaChanges = files.data.some(f => 
              f.filename.includes('schema.prisma')
            );
            
            const hasPrismaMigration = files.data.some(f => 
              f.filename.includes('prisma/migrations/') && 
              f.filename.endsWith('.sql')
            );
            
            if (hasSchemaChanges && !hasPrismaMigration) {
              // Schema changed but no migration
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ⚠️ Schema Change Detected
                
                This PR modifies \`schema.prisma\` but doesn't include a Prisma migration.
                
                **Required Actions:**
                1. Run \`npx prisma migrate dev --name your_migration_name\` to create a migration
                2. Test the migration locally
                3. Commit the generated migration files in \`prisma/migrations/\`
                
                **Production Deployment:**
                After merging, the migration will be automatically applied via \`npx prisma migrate deploy\`.`
              });
              
              core.setFailed('Schema changed without Prisma migration');
            } else if (hasSchemaChanges && hasPrismaMigration) {
              // Both present - good!
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ✅ Migration Included
                
                This PR includes both schema changes and Prisma migration files.
                
                **After merging:** Migration will be automatically deployed to production.`
              });
            }
name: Deploy API to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  PROJECT_ID: hantibink
  REGION: us-central1
  SERVICE_NAME: hantibink-api

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    # Prevent concurrent deployments to avoid migration conflicts
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./api
        run: npx prisma generate

      - name: Check Migration Status
        working-directory: ./api
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          echo "Checking migration status..."
          npx prisma migrate status || echo "Pending migrations detected"

      - name: Deploy Database Migrations
        working-directory: ./api
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          echo "Deploying migrations to production database..."
          npx prisma migrate deploy
          echo "✅ Migrations deployed successfully"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        working-directory: ./api
        run: |
          # Build with the checked-in Dockerfile (single source of truth)
          docker build --platform linux/amd64 --no-cache -t gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA .
          docker tag gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          # ^##^ switches the --set-env-vars delimiter from "," to "##" so
          # comma-containing values (ADMIN_EMAILS, CORS_ORIGIN) parse intact
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars="^##^NODE_ENV=production##HOST=0.0.0.0##FIREBASE_PROJECT_ID=hantibink##DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}##DIRECT_URL=${{ secrets.SUPABASE_DIRECT_URL }}##JWT_SECRET=${{ secrets.JWT_SECRET }}##GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}##GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}##ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}##CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}##SENTRY_DSN=${{ secrets.SENTRY_DSN }}##RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}##FROM_EMAIL=${{ secrets.FROM_EMAIL }}##APP_URL=${{ secrets.APP_URL }}##FIREBASE_SERVICE_ACCOUNT_KEY_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" \
            --session-affinity \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi

      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format='value(status.url)')
          echo "API deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Test deployment
        run: |
          curl -f ${{ env.SERVICE_URL }}/health || exit 1
          echo "Health check passed!"
